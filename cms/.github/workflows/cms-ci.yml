name: CMS CI

on:
  push:
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'test/**'
      - 'plugins/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nest-cli.json'
      - 'tsconfig*.json'
      - '.github/workflows/cms-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'test/**'
      - 'plugins/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nest-cli.json'
      - 'tsconfig*.json'
      - '.github/workflows/cms-ci.yml'

jobs:
  cms:
    name: Unified CMS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
